; =====================================================================
;  青冥 · 资源自动更新   唯一配置文件
;  ---------------------------------------------------------------------
;  换服 / 换端口 / 换电脑，只改这里，不用动任何脚本或 jar。
;  改完保存，重新双击「一键启动.bat」生效。
;  路径统一用正斜杠 / 或双反斜杠 \\，别用单个 \（会被当转义）。
; =====================================================================

[frp]
; frp 服务端地址 + 端口。free.frp.vip 的端口固定是 3010，
; 自己搭的 frps 一般填 7000（看你 frps.ini 里的 bind_port）。
server_addr = free.frp.vip
server_port = 3010

; frp 用户标识：一机一个，别人的必须换成他自己的，否则会互相抢隧道。
; free.frp.vip 的客户端 GUI 会自动生成一串；用别人的会连不上或顶号。
; 自己搭 frps 且没开鉴权的话，这里留空。
user =

; 映射到公网的端口 —— 玩家就是连 域名:这个端口。
; 免费节点只给一个端口，MC 和资源更新共用它（靠分流器区分）。
remote_port = 11491


[server]
; 本机 Minecraft 服务器端口（Paper/Spigot 的 server-port）
mc_port = 25565

; 分流器监听端口，frpc 会把流量转到这里。不能和上面相同。
mux_port = 25566

; 资源 HTTP 服务端口，仅本机使用（靠分流器对外）。不能和上面相同。
http_port = 8080


[paths]
; 【资源来源】客户端 resourcepacks/DragonCore 目录的完整路径。
; 所有龙核贴图 / 模型都从这里推上线。
source_pack =

; 【发布目录】服务端 webroot 目录，会在里面建 dc/ 子目录。
webroot =


[client]
; 玩家客户端拉资源的地址。留空 = 自动用 http://server_addr:remote_port/dc/
; 只有「公网地址和 frp 不一致」时才需要填（比如套了 CDN、或用了 80 端口域名）。
base_url =

; =====================================================================
;  青冥 · 资源自动更新   唯一配置文件
;  ---------------------------------------------------------------------
;  换服务器 / 换端口 / 换电脑，只改这里，不用动任何脚本或 jar。
;  改完保存，重新双击「一键启动.bat」生效。
;  路径统一用正斜杠 / 或双反斜杠 \\，别用单个 \（会被当转义）。
; =====================================================================

[network]
; 对外方式，二选一：
;   direct = 服务器有公网 IP（VPS / 云服务器），直接对外，最简单
;   relay  = 家里电脑没公网 IP，用 frp 等内网穿透把端口映射出去
; direct 模式不需要 [relay] 段，也不用分流器，防火墙放行端口即可。
mode = relay

; 玩家连接的公网地址（域名或 IP）。
;   direct 模式：必填，填服务器的公网 IP 或域名
;   relay  模式：留空 = 自动使用下面 [relay] 里中转服务的地址
public_host =

; 玩家连接的公网端口。
;   direct 模式：留空 = 直接用 mc_port
;   relay  模式：必填，中转服务映射出来的公网端口
public_port =

[relay]
; 仅 mode = relay 时生效。
; 内网穿透服务的地址与端口（例如自建 frps 的地址和 bind_port）。
server =
port = 7000

; 通道标识：多数免费穿透服务要求一人一个，必须换成你自己的；
; 自建服务且未开鉴权时留空即可。
token =

[server]
; 本机 Minecraft 服务器端口（server.properties 里的 server-port）
mc_port = 25565

; 分流器监听端口，relay 模式下中转客户端把流量转到这里。不能和 mc_port 相同。
mux_port = 25566

; 资源 HTTP 服务端口。relay 模式仅本机使用；direct 模式对外（防火墙放行）。
http_port = 8080

[paths]
; 【资源来源】客户端 resourcepacks/DragonCore 目录的完整路径。
; 所有龙核贴图 / 模型都从这里推上线。
source_pack =

; 【发布目录】服务端 webroot 目录，会在里面建 dc/ 子目录。
webroot =

[client]
; 玩家客户端拉资源的地址。留空 = 自动按上面配置推导。
; 只有「资源地址和游戏地址不一致」时才需要填（比如套了 CDN、或用了 80 端口域名）。
base_url =
